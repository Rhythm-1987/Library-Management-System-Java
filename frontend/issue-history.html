<!doctype html>
<html>
  <head>
    <title>Issue History</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="sidebar">
      <h2>Library</h2>
      <a href="index.html">Dashboard</a>
      <a href="add-member.html">Add Member</a>
      <a href="view-members.html">View Members</a>
      <a href="add-book.html">Add Book</a>
      <a href="view-books.html">View Books</a>
      <a href="issue-book.html">Issue Book</a>
      <a href="return-book.html">Return Book</a>
      <a href="issue-history.html">Issue History</a>
      <a href="reports.html">Reports</a>
    </div>

    <div class="main">
      <div class="page-header">
        <h1>Issue History</h1>
        <span class="subtitle">All issued transactions</span>
      </div>

      <div class="card">
        <div
          style="display: flex; justify-content: flex-end; margin-bottom: 12px"
        >
          <button class="btn-export" onclick="exportIssuesCSV()">
            ⬇️ Export CSV
          </button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Member ID</th>
              <th>Book Code</th>
              <th>Book Name</th>
              <th>Issue Date</th>
              <th>Return Date</th>
            </tr>
          </thead>
          <tbody id="issueTable"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
